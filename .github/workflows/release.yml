name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test system update packager
        run: python3 -m unittest discover -s tests -p 'test_system_update_package.py'

      - name: Build the device toolchain image
        run: docker build -f docker/Dockerfile.device -t cartridge-device .

      - name: Cross-compile all binaries for aarch64
        run: |
          docker run --rm -v "$PWD":/src -w /src cartridge-device \
            cargo build --workspace --release --target aarch64-unknown-linux-gnu
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Generate overlay assets
        run: python3 scripts/generate_overlays.py

      - name: Prepare release bundle
        run: |
          mkdir -p release/Cartridge/assets/fonts
          mkdir -p release/Cartridge/assets/overlays
          mkdir -p release/Cartridge/assets/brand
          # Binaries
          cp target/aarch64-unknown-linux-gnu/release/cartridge release/Cartridge/
          cp target/aarch64-unknown-linux-gnu/release/cartridge-boot release/Cartridge/
          chmod +x release/Cartridge/cartridge
          chmod +x release/Cartridge/cartridge-boot

          # Boot scripts
          cp deploy/cartridge-boot.sh release/Cartridge/
          cp deploy/cartridge-boot.service release/Cartridge/
          cp deploy/game-library.py deploy/setup-primary.py deploy/cartridge-session.py release/Cartridge/
          cp deploy/autosetup.sh release/Cartridge/
          chmod +x release/Cartridge/cartridge-boot.sh
          chmod +x release/Cartridge/autosetup.sh

          # Registry
          cp registry.json release/Cartridge/ 2>/dev/null || true

          # Assets
          cp -r assets/fonts/* release/Cartridge/assets/fonts/
          cp -r assets/overlays/* release/Cartridge/assets/overlays/
          cp -r assets/brand/* release/Cartridge/assets/brand/
          cp -r assets/icons release/Cartridge/assets/icons
          cp assets/gamecontrollerdb.txt release/Cartridge/assets/
          cp assets/boot_logo.png release/Cartridge/assets/
          cp assets/logo.bmp release/Cartridge/assets/

          # Lua cartridges (bundled apps with icons)
          cp -r lua_cartridges release/Cartridge/lua_cartridges

          # Tools menu scripts (inside Cartridge/ so extracting doesn't overwrite existing tools)
          mkdir -p release/Cartridge/tools
          cp "deploy/tools/Cartridge.sh" release/Cartridge/tools/
          cp "deploy/tools/Setup Cartridge Boot.sh" release/Cartridge/tools/
          cp "deploy/tools/Undo Cartridge Boot.sh" release/Cartridge/tools/
          chmod +x release/Cartridge/tools/*.sh

          # Boot logo (for BOOT partition)
          cp assets/logo.bmp release/logo.bmp

          # Install instructions
          cp INSTALL.md release/INSTALL.txt 2>/dev/null || true

      - name: Package unsigned system update (no signing or publishing)
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 scripts/package_system_update.py \
            --bundle release/Cartridge --output system-update \
            --version "$VERSION" --revision "$(git rev-parse HEAD)"
          python3 scripts/package_system_update.py --verify system-update/system-update.unsigned.json

      - name: Upload unsigned system update for local review
        uses: actions/upload-artifact@v4
        with:
          name: cartridge-system-update-aarch64-unsigned
          if-no-files-found: error
          path: |
            system-update/*.tar.gz
            system-update/system-update.unsigned.json

      - name: Upload exact tagged ARM checks for isolated VM rehearsal
        uses: actions/upload-artifact@v4
        with:
          name: cartridge-device-checks-aarch64
          if-no-files-found: error
          path: |
            target/aarch64-unknown-linux-gnu/release/app-check
            target/aarch64-unknown-linux-gnu/release/sim-check
            target/aarch64-unknown-linux-gnu/release/store-check

      - name: Create zip
        working-directory: release
        run: zip -r ../cartridge-r36s-plus.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cartridge-r36s-plus.zip
          generate_release_notes: true
          draft: true
          body: |
            ## Installation

            1. Download `cartridge-r36s-plus.zip`
            2. Extract the zip to your SD card's `roms/` folder (creates `roms/Cartridge/`)
            3. Copy the 3 `.sh` files from `roms/Cartridge/tools/` into `roms/tools/`
            4. Boot your device into EmulationStation
            5. Go to **Tools > Cartridge** and confirm it runs on your handheld
            6. Run **Tools > Setup Cartridge Boot** once, then reboot to start directly in Cartridge

            This archive is an application bundle for existing systems. The planned one-step SD image installer is not included.

            ## Custom Boot Logo (optional)

            Copy `logo.bmp` from the zip root to the root of your SD card's **BOOT** partition to replace the default ArkOS boot screen with the CartridgeOS splash.

            See `INSTALL.txt` in the zip for full instructions.
