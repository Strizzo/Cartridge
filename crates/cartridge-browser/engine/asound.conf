# Private browser-only mixer. IPC is confined to bubblewrap's IPC namespace.
# Keep one hardware stream at 48 kHz and convert/mix page streams into it.
pcm.cartridge {
    type plug
    slave.pcm {
        type dmix
        ipc_key 1128354388
        ipc_key_add_uid true
        ipc_perm 0600
        slave {
            pcm "hw:CARD=rockchiprk817co,DEV=0"
            format S16_LE
            rate 48000
            channels 2
            period_size 1024
            buffer_size 8192
        }
    }
}
